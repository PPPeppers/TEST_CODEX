name: Build and deploy GodotQuest Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o engine.zip
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o templates.tpz
          curl -fsSL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          checksums = {}
          for line in Path("SHA512-SUMS.txt").read_text().splitlines():
              parts = line.split()
              if len(parts) == 2:
                  checksums[parts[1].lstrip("*")] = parts[0]
          release = os.environ["GODOT_RELEASE"]
          for local, official in {
              "engine.zip": f"Godot_v{release}_linux.x86_64.zip",
              "templates.tpz": f"Godot_v{release}_export_templates.tpz",
          }.items():
              with open(local, "rb") as stream:
                  actual = hashlib.file_digest(stream, "sha512").hexdigest()
              if actual != checksums[official]:
                  raise SystemExit(f"Checksum mismatch: {official}")
          PY
          unzip -q engine.zip -d engine
          unzip -q templates.tpz -d extracted
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp -a extracted/templates/. "$target/"
          chmod +x "engine/Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "$RUNNER_TEMP/godot/engine" >> "$GITHUB_PATH"
      - name: Import and export Web
        shell: bash
        run: |
          set -euo pipefail
          "Godot_v${GODOT_RELEASE}_linux.x86_64" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
          mkdir -p build/web
          "Godot_v${GODOT_RELEASE}_linux.x86_64" --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          for file in index.html index.js index.wasm index.pck; do test -s "build/web/$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: GodotQuest-Web
          path: build/web/
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
